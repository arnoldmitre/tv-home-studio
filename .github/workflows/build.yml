name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x launcher/gradlew

      - name: Build APKs
        working-directory: launcher
        run: ./gradlew :app:assembleDebug :companion:assembleDebug

      - name: Upload TV Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Home-Launcher-debug
          path: launcher/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Phone Companion APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Home-Studio-Phone-Companion-debug
          path: launcher/companion/build/outputs/apk/debug/companion-debug.apk
